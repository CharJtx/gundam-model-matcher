<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>机体资源匹配台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c121b;color:#dae4ef;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}header{height:66px;padding:16px 24px;border-bottom:1px solid #2a3849;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0}small,.muted{color:#8497ae}main{display:grid;grid-template-columns:285px minmax(350px,1fr) 390px;height:calc(100vh - 66px)}aside{padding:16px;overflow:auto}aside:first-child{border-right:1px solid #2a3849}.right{border-left:1px solid #2a3849}input,select,textarea,button{font:inherit;color:inherit;background:#152231;border:1px solid #35475d;border-radius:5px;padding:9px;max-width:100%}input,textarea{width:100%;margin:7px 0}button{cursor:pointer}button:hover{border-color:#5cabc7}.primary{background:#217b8d;border-color:#3699ae}.danger{color:#f3a69d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{display:block;margin-top:16px;color:#aebfd0}.list{margin-top:12px}.model{width:100%;text-align:left;margin:3px 0;padding:10px}.model.active{background:#204257;border-color:#51bdd2}.model .id{font-size:11px;color:#9cb1c6}.done{color:#65d4a7;float:right}.stage{position:relative;min-width:0;overflow:hidden}#view{height:100%;width:100%}.overlay{position:absolute;top:16px;left:18px;pointer-events:none;max-width:90%;background:#101b28d9;padding:10px;border-radius:5px}#stageStatus{font-size:12px;color:#a4bfd0;max-width:540px;white-space:pre-wrap}.toolbar{position:absolute;bottom:18px;left:18px;display:flex;gap:8px}h2{font-size:15px;margin:20px 0 8px}.unit{padding:10px;background:#131f2c;border:1px solid #2a3c50;margin:6px 0;border-radius:5px}.unit label{margin:0;cursor:pointer;display:flex;gap:7px;align-items:center}.unit input{width:auto}.stats{font-size:12px;color:#a6bbcc;margin-top:6px;line-height:1.7}.mesh{display:flex;gap:6px;align-items:center;margin:7px 0}.mesh input{width:auto}.mesh span{font-size:11px;overflow:hidden;text-overflow:ellipsis;max-width:150px}.mesh select{width:180px;font-size:11px;padding:5px}#results{max-height:300px;overflow:auto}#notice{color:#7bdac2;min-height:22px;white-space:pre-wrap}details{margin-top:15px}#savePath{font-size:11px;word-break:break-all}a{color:#72c7e3}#unitDetail{font-size:12px;max-height:230px;overflow:auto;white-space:pre-wrap}button:disabled{opacity:.4;cursor:default}.tag{font-size:11px;background:#29394a;border-radius:4px;padding:3px 7px}@media(max-width:1100px){main{grid-template-columns:230px 1fr 320px}}
.savebar{position:sticky;top:-16px;z-index:5;background:#0c121bf5;margin:-16px -16px 16px;padding:14px 16px 4px;border-bottom:1px solid #35475d}.savebar #notice{margin:7px 0;min-height:16px;font-size:12px}.unit label{align-items:center}.portrait{width:82px;height:82px;object-fit:contain;background:#e1e8ef;border-radius:4px;flex-shrink:0}.portrait-empty{width:82px;height:82px;display:flex;align-items:center;justify-content:center;background:#223042;color:#92a6b8;border-radius:4px;font-size:12px;flex-shrink:0}#results{max-height:390px}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<header><h1>机体资源匹配台 <span class="tag">本地工具</span></h1><span id="progress">读取资源…</span><a href="/api/export" download="model_matches.json">导出匹配 JSON</a></header>
<main><aside><b>模型资源</b><input id="modelSearch" placeholder="搜索资源编号、名称或已匹配条目"><select id="filter"><option value="all">全部资源</option><option value="todo">未匹配</option><option value="done">已匹配</option></select><div id="count" class="muted"></div><div id="models" class="list"></div><button id="more">显示更多</button></aside>
<section class="stage"><div id="view"></div><div class="overlay"><b id="modelTitle">选择一个模型</b><div id="stageStatus">拖动旋转 · 滚轮缩放 · 右键平移</div></div><div class="toolbar"><button id="reset">重置视角</button><button id="wire">线框</button><button id="rotate">自动旋转</button><button id="flip">翻转贴图 V</button></div></section>
<aside class="right"><div class="savebar"><div class="row"><button id="save" class="primary" disabled>保存匹配</button><button id="remove" class="danger" disabled>移除匹配</button></div><p id="notice" role="status"></p></div><b>关联数据模板</b><div class="muted">可关联多个条目。Wiki 数据与资源版本不同，保存人工确认结果，不自动生成游戏机型编号。</div><input id="unitSearch" placeholder="搜索机体名称，例如 吉姆"><div id="selected"></div><div id="results"></div><details><summary>查看选中条目的性能与武器</summary><pre id="unitDetail"></pre></details>
<h2>网格与贴图</h2><div class="muted">静态姿态；可隐藏替换手型、光束与贴花。贴图按网格手动选择并保存。</div><div id="meshes"></div>
<label>标注备注</label><textarea id="notes" rows="3" placeholder="例如：已确认吉姆本体；手型隐藏；对应银图与金图共用模型"></textarea><details><summary>保存位置与使用说明</summary><p id="savePath"></p><p>结果保存在服务器端 JSON，关闭浏览器后仍保留。加载其他模型前会提示未保存更改。</p></details></aside></main>
<script type="module" src="/app.js"></script></html>
